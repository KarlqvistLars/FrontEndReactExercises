services:
  api:
    build: .
    container_name: movie-api
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Movie2APIContext: "Server=sqlserver;Database=MovieAPIDb;User Id=sa;Password=MyStrongPassword123!;TrustServerCertificate=True;"

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: movie-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_password123"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: